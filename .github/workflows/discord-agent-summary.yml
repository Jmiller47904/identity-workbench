name: Forward Identity Workbench agent summaries to Discord

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.issue.number == 12 &&
      github.actor == 'Jmiller47904' &&
      contains(github.event.comment.body, '<!-- codex-agent-summary -->')
    runs-on: ubuntu-latest
    steps:
      - name: Send summary to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
from urllib.error import HTTPError

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is not configured")
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          body = event["comment"]["body"].replace("<!-- codex-agent-summary -->", "").strip()
          prefix = "**Identity Workbench Build Agent**\n"
          content = prefix + body
          if len(content) > 1900:
              content = content[:1897] + "..."
          payload = json.dumps({
              "content": content,
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 204):
                  raise SystemExit(f"Discord returned unexpected status {response.status}")
          PY
